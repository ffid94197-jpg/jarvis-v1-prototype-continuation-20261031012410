name: Minecraft Java survival-rule campaign (Dragon then Netherite)
on:
  push:
    branches: [test/minecraft-dragon-first-netherite-sim-20261102]
    paths:
      - "windows-companion/minecraft-bot/**"
      - ".github/workflows/minecraft-dragon-first-sim.yml"
  pull_request:
    branches: [fix/autonomy-durable-proof-and-corpus-20261102]
    paths:
      - "windows-companion/minecraft-bot/**"
      - ".github/workflows/minecraft-dragon-first-sim.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  survival-model:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Existing progression and late-game contracts
        shell: bash
        run: |
          node windows-companion/minecraft-bot/verify_progression.cjs
          node windows-companion/minecraft-bot/verify_late_game.cjs
      - name: Actual planner versus independent survival world model
        shell: bash
        env:
          JARVIS_MC_SIM_SEEDS: "40"
        run: node windows-companion/minecraft-bot/verify_java_survival_campaign.cjs
      - name: Live-skill mocked protocol regressions (not a Minecraft server)
        shell: bash
        run: node windows-companion/minecraft-bot/verify_late_skills.cjs
