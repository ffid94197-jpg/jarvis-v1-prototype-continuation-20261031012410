name: Prototype JARVIS post-merge full Windows regression
# Runs on an isolated branch; this is regression evidence, not V1 certification.
# Never interacts with PC Work JARVIS or owner credentials.
on:
  push:
    branches:
      - test/postmerge-full-windows-acceptance-20261104
    paths:
      - .github/workflows/postmerge-windows-acceptance.yml
      - scripts/acceptance/postmerge-windows-battery.cjs
      - scripts/**
      - windows-companion/**
      - src/**
      - package.json
      - package-lock.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-offline:
    runs-on: windows-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: pwsh
    env:
      JARVIS_LOCAL_PROJECT_BUILD_ENABLED: '0'
      JARVIS_AGENT_NO_EXTERNAL_EFFECTS: '1'
      DATABASE_URL: file:./jarvis-postmerge-ci.db
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify isolated Windows baseline
        run: |
          if ((node -p "process.platform") -ne "win32") { throw "Native Windows runner required" }
          if ((git rev-parse --abbrev-ref HEAD) -eq "main") { throw "Refusing to run experimental battery directly on main" }
          Write-Output "SOURCE_COMMIT=$env:GITHUB_SHA"
      - name: Install locked JavaScript and Minecraft dependencies
        run: |
          npm.cmd ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Root npm ci failed" }
          npm.cmd ci --prefix windows-companion/minecraft-bot --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Minecraft dependency installation failed" }
          npx.cmd prisma generate
          if ($LASTEXITCODE -ne 0) { throw "Prisma generation failed" }
      - name: Install Python integration dependencies
        run: |
          python -m pip install -r windows-companion/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Windows companion Python dependency installation failed" }
      - name: Clean full TypeScript compilation
        continue-on-error: true
        run: |
          $PSNativeCommandUseErrorActionPreference=$false
          New-Item -ItemType Directory -Force artifacts/postmerge-windows | Out-Null
          npx.cmd tsc --noEmit --incremental false *> artifacts/postmerge-windows/typecheck.log
          $code=$LASTEXITCODE
          Set-Content artifacts/postmerge-windows/typecheck.exitcode $code
          Get-Content artifacts/postmerge-windows/typecheck.log -Tail 50
          Write-Output "TYPECHECK_EXIT=$code"
      - name: Execute Core, intelligence, integrations and Minecraft offline battery
        continue-on-error: true
        run: |
          $PSNativeCommandUseErrorActionPreference=$false
          node scripts/acceptance/postmerge-windows-battery.cjs *> artifacts/postmerge-windows/battery-console.log
          $code=$LASTEXITCODE
          Set-Content artifacts/postmerge-windows/battery.exitcode $code
          Get-Content artifacts/postmerge-windows/battery-console.log -Tail 110
          Write-Output "OFFLINE_BATTERY_EXIT=$code"
      - name: Production build and artifact checks
        continue-on-error: true
        run: |
          $PSNativeCommandUseErrorActionPreference=$false
          $env:NODE_ENV='production'
          npm.cmd run build *> artifacts/postmerge-windows/build.log
          $code=$LASTEXITCODE
          Set-Content artifacts/postmerge-windows/build.exitcode $code
          Get-Content artifacts/postmerge-windows/build.log -Tail 90
          Write-Output "PRODUCTION_BUILD_EXIT=$code"
      - name: Independently reject any failed required gate
        run: |
          $failed=@()
          foreach ($gate in @('typecheck','battery','build')) {
            $name="artifacts/postmerge-windows/$gate.exitcode"
            if (!(Test-Path $name)) { $failed += "${gate}:missing"; continue }
            $code=(Get-Content $name -Raw).Trim()
            if ($code -ne '0') { $failed += "${gate}:$code" }
          }
          if ($failed.Count -gt 0) { throw "POSTMERGE_WINDOWS_ACCEPTANCE_FAILED: $($failed -join ', ')" }
          Write-Output 'POSTMERGE_WINDOWS_OFFLINE_ACCEPTANCE_PASS - NOT full V1 or real-model/game acceptance'
      - name: Upload unmodified test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-postmerge-full-windows-offline-evidence
          path: |
            artifacts/postmerge-windows
            jarvis-autonomy-deep-results.json
            jarvis-autonomy-longrun-results.json
            PRODUCTION_BUILD_ARTIFACTS.json
          if-no-files-found: warn
