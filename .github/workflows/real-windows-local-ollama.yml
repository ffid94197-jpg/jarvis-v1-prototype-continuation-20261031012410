name: JARVIS real Windows live task after root-cause fixes
on:
  push:
    branches: [fix/live-windows-autonomy-v7-20261101, fix/live-windows-autonomy-v8-20261101, fix/autonomy-peak-acceptance-20261101]
permissions:
  contents: read
jobs:
  native-real-ollama:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      OLLAMA_HOST: 127.0.0.1:11434
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows full JARVIS dependencies and production compilation
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
          $env:DATABASE_URL = "file:./jarvis-ci-build-only.db"
          $env:NODE_ENV = "production"
          $env:JARVIS_LOCAL_DEV_NO_LOGIN = "0"
          npm run db:generate
          if ($LASTEXITCODE -ne 0) { throw "Prisma generation failed" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Full Next.js production build failed" }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw "TypeScript failed" }
          node scripts/verify-long-goal-planner-selection.cjs
          if ($LASTEXITCODE -ne 0) { throw "Compact local inference regression failed" }
          node scripts/verify-source-path-tool-safety.cjs
          if ($LASTEXITCODE -ne 0) { throw "Actual file write regression failed" }
      - name: Install genuine Windows companion Python dependencies
        run: |
          python -m pip install -r windows-companion/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Companion install failed" }
      - name: Install native Windows Ollama CLI from official GitHub release
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path ".ollama-runtime" | Out-Null
          curl.exe -fSL --retry 3 --connect-timeout 20 "https://github.com/ollama/ollama/releases/download/v0.40.13/ollama-windows-amd64.zip" -o ".ollama-runtime.zip"
          if ($LASTEXITCODE -ne 0) { throw "Official Ollama Windows archive download failed" }
          Expand-Archive ".ollama-runtime.zip" -DestinationPath ".ollama-runtime" -Force
          if (-not (Test-Path ".ollama-runtime/ollama.exe")) { throw "Ollama CLI missing from archive" }
          .\.ollama-runtime\ollama.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Ollama Windows CLI failed" }
      - name: Start local model server and download real coding model
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = "Stop"
          $ollama = (Resolve-Path ".ollama-runtime/ollama.exe").Path
          $server = Start-Process -FilePath $ollama -ArgumentList "serve" -WindowStyle Hidden -PassThru
          Write-Host "Ollama Windows PID: $($server.Id)"
          $ready = $false
          for ($i=0; $i -lt 45; $i++) {
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:11434/api/version" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ready = $true; break }
            } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { throw "Local Ollama Windows server failed startup" }
          & $ollama pull "qwen2.5-coder:3b"
          if ($LASTEXITCODE -ne 0) { throw "Coding model download failed" }
          & $ollama list
      - name: Execute unchanged hardest sampled internet task via REAL JARVIS with local model
        timeout-minutes: 43
        env:
          JARVIS_LIVE_LOCAL_MODEL: '1'
          JARVIS_OLLAMA_MODEL: qwen2.5-coder:3b
          JARVIS_OLLAMA_NUM_CTX: '8192'
          JARVIS_OLLAMA_NUM_PREDICT: '2048'
          JARVIS_OLLAMA_COMPACT_HISTORY: '1'
          JARVIS_OLLAMA_REQUEST_TIMEOUT_MS: '300000'
          JARVIS_GOAL_PLAN_CONCISE: '1'
          JARVIS_GOAL_PLAN_ADVISORY_FALLBACK: '1'
          JARVIS_MODEL_REQUEST_TIMEOUT_MS: '120000'
          NODE_ENV: development
        run: |
          node scripts/verify-live-windows-jarvis-actual-task.mjs
          if ($LASTEXITCODE -ne 0) { throw "Live autonomous end-to-end task not verified" }
      - name: Upload real Windows execution receipts, external prompt and workspace hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-real-windows-local-model-task
          path: |
            live-windows-evidence/**
            agent-workspace/**
          if-no-files-found: warn
          retention-days: 14
